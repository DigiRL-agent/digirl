# ADAT Baseline Configuration - All Features Disabled
# Use this as a baseline to compare against full ADAT

defaults:
  - default
  - _self_

run_name: "adat-baseline"
save_path: "./outputs/adat/${run_name}"

# Disable all ADAT features (equivalent to original DigiRL)
use_adaptive_sampling: false
use_trajectory_weighting: false
use_curriculum: false
use_hyperparameter_scheduling: false
